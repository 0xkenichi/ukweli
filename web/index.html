<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukweli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06070c;
    --ink: #f3f0ea;
    --muted: rgba(243, 240, 234, .58);
    --faint: rgba(243, 240, 234, .14);
    --glass: rgba(14, 15, 24, .62);
    --glass-strong: rgba(14, 15, 24, .82);
    --ledger: #f2a33a;
    --mpesa: #2fd27a;
    --owner: #7b93ff;
    --gold: #ffcf6b;
    --bad: #ff6b5e;
    --display: "Space Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 15px/1.45 var(--display); -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.65) 100%); }

  .ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; pointer-events: none; padding: 18px 22px; gap: 14px; }
  .ui > * { pointer-events: auto; }
  .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--faint); border-radius: var(--r); }

  /* ---------- Top bar ---------- */
  .top { display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
  .brand b { font-size: 22px; letter-spacing: .32em; font-weight: 700; }
  .brand span { color: var(--muted); font-size: 13px; }
  .cases { display: flex; gap: 6px; margin: 0 auto; padding: 5px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .cases::-webkit-scrollbar { display: none; }
  .case { border: 0; background: transparent; border-radius: 12px; padding: 7px 12px; display: flex; gap: 8px; align-items: center;
    color: var(--muted); white-space: nowrap; transition: background .2s, color .2s; }
  .case:hover { color: var(--ink); background: rgba(255,255,255,.05); }
  .case.on { background: rgba(255,255,255,.1); color: var(--ink); }
  .case .num { font-family: var(--mono); font-size: 12px; opacity: .7; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mpesa); box-shadow: 0 0 10px var(--mpesa); }
  .dot.ask { background: var(--owner); box-shadow: 0 0 10px var(--owner); }
  .tools { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 13px; }
  .seg button.on { background: var(--ink); color: #111; }
  .ghost { border: 1px solid var(--faint); background: none; border-radius: 999px; padding: 7px 12px; color: var(--muted); font-size: 13px; }
  .ghost:hover { color: var(--ink); border-color: rgba(255,255,255,.3); }

  /* ---------- Question + versus HUD ---------- */
  .head { display: grid; justify-items: center; gap: 12px; }
  .question { margin: 0; text-align: center; font-size: clamp(20px, 2.6vw, 34px); line-height: 1.15; letter-spacing: -.02em; font-weight: 600; max-width: 900px;
    text-wrap: balance; }
  .question .w { display: inline-block; opacity: 0; transform: translateY(10px); filter: blur(6px); transition: opacity .5s, transform .5s, filter .5s; }
  .question .w.in { opacity: 1; transform: none; filter: none; }

  .versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 10px; width: min(860px, 100%); }
  .agent { padding: 10px 16px; display: grid; gap: 2px; position: relative; overflow: hidden; }
  .agent.ledger { border-color: rgba(242,163,58,.35); }
  .agent.mpesa { border-color: rgba(47,210,122,.35); text-align: right; }
  .agent .name { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .agent.mpesa .name { justify-content: flex-end; }
  .agent .sees { color: var(--muted); font-size: 12px; }
  .agent .belief { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .agent.ledger .belief { color: var(--ledger); }
  .agent.mpesa .belief { color: var(--mpesa); }
  .agent .was { font-size: 14px; color: var(--muted); text-decoration: line-through; margin-right: 6px; font-weight: 500; }
  .agent.mpesa .was { margin: 0 0 0 6px; }
  .pips { display: flex; gap: 5px; margin-top: 4px; min-height: 10px; }
  .agent.mpesa .pips { justify-content: flex-end; }
  .pip { width: 22px; height: 6px; border-radius: 3px; background: currentColor; transition: opacity .3s, transform .3s; }
  .agent.ledger .pip { color: var(--ledger); }
  .agent.mpesa .pip { color: var(--mpesa); }
  .pip.owner { color: var(--owner) !important; }
  .pip.down { opacity: .22; transform: scaleY(.5); }
  .agent.speaking::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px currentColor; animation: ping 1s ease-out; }
  .agent.ledger.speaking::after { color: var(--ledger); }
  .agent.mpesa.speaking::after { color: var(--mpesa); }
  @keyframes ping { from { opacity: 1; } to { opacity: 0; } }
  .vs { display: grid; place-items: center; padding: 0 14px; min-width: 120px; text-align: center; }
  .vs b { font-size: 13px; letter-spacing: .3em; color: var(--muted); }
  .vs small { display: block; font-size: 12px; margin-top: 4px; color: var(--gold); font-family: var(--mono); }

  /* ---------- Bottom: caption + controls ---------- */
  .bottom { display: grid; justify-items: center; gap: 10px; align-self: end; }
  .caption { width: min(860px, 100%); padding: 14px 18px; min-height: 92px; display: grid; gap: 6px; }
  .caption .who { display: flex; gap: 8px; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
  .caption .who.ledger { color: var(--ledger); }
  .caption .who.mpesa { color: var(--mpesa); }
  .caption .who.owner { color: var(--owner); }
  .caption .who.gold { color: var(--gold); }
  .caption .text { font-size: clamp(15px, 1.5vw, 19px); line-height: 1.4; min-height: 1.4em; }
  .caption .text .cursor { display: inline-block; width: .5ch; background: currentColor; animation: blink .9s steps(1) infinite; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }
  .rule { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .rule em { color: var(--gold); font-style: normal; }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .play { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; color: #111;
    background: linear-gradient(135deg, #ffe6a8, var(--gold)); box-shadow: 0 0 24px rgba(255,207,107,.35); }
  .play:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .controls label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .controls select { background: var(--glass-strong); border: 1px solid var(--faint); border-radius: 999px; padding: 6px 10px; }

  /* ---------- Verdict ---------- */
  .verdict { width: min(860px, 100%); padding: 18px 20px; position: relative; display: grid; grid-template-columns: auto 1fr; gap: 6px 20px;
    background: var(--glass-strong); animation: rise .6s cubic-bezier(.2,.8,.2,1); }
  .verdict::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--a, 0deg), transparent 0 60%, var(--glow, var(--gold)) 75%, transparent 90%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 3.5s linear infinite; }
  .verdict.ask { --glow: var(--owner); }
  @property --a { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes spin { to { --a: 360deg; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
  .ring { grid-row: span 3; width: 86px; height: 86px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--faint); }
  .ring .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .verdict h3 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  .verdict h3 em { font-style: normal; color: var(--gold); }
  .verdict .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .verdict .action { margin: 0; font-size: 16px; }
  .verdict .diff { font-family: var(--mono); font-size: 12px; color: var(--muted); grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid var(--faint); overflow-wrap: anywhere; }
  .diff .old { color: var(--bad); text-decoration: line-through; }
  .diff .new { color: var(--mpesa); }
  .orb { grid-row: span 3; width: 86px; height: 86px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 35% 30%, #fff, var(--owner) 45%, #1d2560 100%); box-shadow: 0 0 40px rgba(123,147,255,.55); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .answers { display: flex; gap: 8px; margin-top: 6px; }
  .answers button { border-radius: 999px; padding: 9px 22px; font-weight: 600; border: 1px solid var(--owner); }
  .answers .yes { background: var(--owner); color: #0b0f2a; }
  .answers .no { background: none; color: var(--owner); }
  .learned { width: min(860px, 100%); padding: 10px 16px; color: #cfd7ff; border-color: rgba(123,147,255,.4); font-size: 14px; animation: rise .5s ease-out; }

  /* ---------- Log drawer ---------- */
  .log { position: fixed; top: 76px; right: 18px; bottom: 18px; width: min(380px, calc(100vw - 36px)); padding: 16px; overflow: auto;
    transform: translateX(calc(100% + 30px)); transition: transform .45s cubic-bezier(.2,.8,.2,1); pointer-events: auto; background: var(--glass-strong); }
  .log.open { transform: none; }
  .log h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .log ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .log li { font-size: 13px; padding-left: 12px; border-left: 2px solid var(--faint); animation: rise .35s ease-out; }
  .log li.ledger { border-color: var(--ledger); }
  .log li.mpesa { border-color: var(--mpesa); }
  .log li b { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: block; }
  .log li .rule { display: block; margin-top: 3px; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; transition: opacity .8s; }
  .loading.gone { opacity: 0; pointer-events: none; }
  .loading p { color: var(--muted); font-size: 15px; display: grid; justify-items: center; gap: 18px; text-align: center; padding: 0 24px; }
  .loading b { font-size: 34px; letter-spacing: .4em; color: var(--ink); }
  .bar2 { width: 180px; height: 2px; background: var(--faint); overflow: hidden; border-radius: 2px; }
  .bar2 i { display: block; height: 100%; width: 40%; background: var(--gold); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .foot { position: fixed; left: 22px; bottom: 14px; font-size: 11px; color: var(--muted); max-width: 300px; pointer-events: none; }
  .foot code { font-family: var(--mono); }

  @media (max-width: 900px) {
    .ui { padding: 12px; gap: 10px; }
    .top { flex-wrap: wrap; }
    .brand span { display: none; }
    .cases { order: 3; width: 100%; margin: 0; }
    .tools { margin-left: auto; }
    .agent .belief { font-size: 22px; }
    .vs { min-width: 70px; padding: 0 6px; }
    .verdict { grid-template-columns: 1fr; }
    .ring, .orb { display: none; }
    .foot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .verdict::before { animation: none; }
    .question .w { transition: none; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="ui">
  <div class="top">
    <div class="brand"><b>UKWELI</b><span id="tagline"></span></div>
    <nav class="cases glass" id="cases" aria-label="Cases"></nav>
    <div class="tools">
      <div class="seg glass" role="group" aria-label="Language">
        <button data-lang="en" class="on">EN</button><button data-lang="sw">SW</button>
      </div>
      <button class="ghost" id="logBtn"></button>
      <button class="ghost" id="forget"></button>
    </div>
  </div>

  <div class="head">
    <h1 class="question" id="question"></h1>
    <div class="versus">
      <div class="agent ledger glass" id="hud-ledger">
        <div class="name">📒 <span data-t="ledger"></span></div>
        <div class="sees" data-t="ledgerSees"></div>
        <div class="belief" id="belief-ledger">—</div>
        <div class="pips" id="pips-ledger"></div>
      </div>
      <div class="vs glass"><div><b>VS</b><small id="status"></small></div></div>
      <div class="agent mpesa glass" id="hud-mpesa">
        <div class="name"><span data-t="mpesa"></span> 📱</div>
        <div class="sees" data-t="mpesaSees"></div>
        <div class="belief" id="belief-mpesa">—</div>
        <div class="pips" id="pips-mpesa"></div>
      </div>
    </div>
  </div>

  <div></div>

  <div class="bottom">
    <div id="banner"></div>
    <div id="verdict"></div>
    <div class="caption glass" id="caption" aria-live="polite">
      <div class="who" id="cap-who"></div>
      <div class="text" id="cap-text"></div>
      <div class="rule" id="cap-rule"></div>
    </div>
    <div class="controls">
      <button class="play" id="play"></button>
      <button class="ghost" id="skip"></button>
      <label><span data-t="speed"></span>
        <select id="speed"><option value="0.7">0.7×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option><option value="2.5">2.5×</option></select>
      </label>
    </div>
  </div>
</div>

<aside class="log glass" id="log"><h4 data-t="log"></h4><ol id="log-list"></ol></aside>
<div class="foot" id="foot"></div>

<div class="loading" id="loading"><p><b>UKWELI</b><span id="loading-text">The agents are reading the shop book and the M-Pesa statement…</span><span class="bar2"><i></i></span></p></div>

<script type="module" src="app.js"></script>
</body>
</html>
